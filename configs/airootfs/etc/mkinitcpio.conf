# mkinitcpio configuration for Omarchy ISO
# This file exists to satisfy archinstall's requirement for mkinitcpio.conf
# archinstall will modify this file during installation
# After installation, setup-dracut.sh will regenerate the initramfs with dracut

MODULES=()
BINARIES=()
FILES=()
HOOKS=(base udev autodetect microcode modconf kms keyboard keymap consolefont block filesystems fsck)
COMPRESSION="zstd"
